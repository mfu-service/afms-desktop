<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' https: data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFMS</title>
    <style>
      :root {
        --navy: #1e3a8a;
        --navy-deep: #0f172a;
        --orange: #f47f0a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --hover: #1e293b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--navy-deep);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        user-select: none;
      }
      .bar {
        display: flex;
        align-items: stretch;
        height: 100%;
        padding: 6px 8px 8px;
        gap: 6px;
      }
      .tabs {
        display: flex;
        flex: 1;
        min-width: 0;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }
      .tabs::-webkit-scrollbar { height: 4px; }
      .tabs::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 92px;
        max-width: 220px;
        flex: 1 1 140px;
        height: 30px;
        padding: 0 8px 0 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        position: relative;
      }
      .tab:hover { background: var(--hover); color: var(--text); }
      .tab.active {
        background: var(--navy);
        color: #fff;
        box-shadow: inset 0 -2px 0 var(--orange);
      }
      .favicon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: 0 0 14px;
        object-fit: contain;
        background: transparent;
      }
      .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12px;
        text-align: right;
      }
      .close {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        font-size: 13px;
        line-height: 18px;
        padding: 0;
        cursor: pointer;
        opacity: 0;
      }
      .tab:hover .close,
      .tab.active .close { opacity: 0.85; }
      .close:hover { background: #be123c; color: #fff; opacity: 1; }
      .new-tab {
        appearance: none;
        width: 30px;
        height: 30px;
        margin-top: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        flex: 0 0 30px;
      }
      .new-tab:hover { background: var(--hover); color: var(--orange); }
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      .progress.on::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: var(--orange);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(250%); }
        100% { transform: translateX(-350%); }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="tabs" id="tabs" role="tablist" aria-label="التبويبات"></div>
      <button class="new-tab" id="new-tab" type="button" title="تبويب جديد (Ctrl+T)" aria-label="تبويب جديد">+</button>
    </div>
    <div class="progress" id="progress"></div>
    <script>
      const tabsEl = document.getElementById('tabs');
      const newTabEl = document.getElementById('new-tab');
      const progressEl = document.getElementById('progress');
      const api = window.afmsTabs;

      function safeFavicon(url) {
        if (!url) return '';
        if (url.startsWith('https:') || url.startsWith('data:image/')) return url;
        return '';
      }

      function render(state) {
        const tabs = state?.tabs || [];
        const activeId = state?.activeId;
        const active = tabs.find((tab) => tab.id === activeId);
        progressEl.classList.toggle('on', Boolean(active?.loading));

        tabsEl.replaceChildren();
        for (const tab of tabs) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'tab' + (tab.id === activeId ? ' active' : '');
          button.role = 'tab';
          button.setAttribute('aria-selected', tab.id === activeId ? 'true' : 'false');
          button.title = tab.title || tab.url || '';
          button.dataset.id = String(tab.id);

          const icon = safeFavicon(tab.favicon);
          if (icon) {
            const img = document.createElement('img');
            img.className = 'favicon';
            img.alt = '';
            img.src = icon;
            img.addEventListener('error', () => img.remove());
            button.appendChild(img);
          }

          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = tab.title || 'منصة AFMS';
          button.appendChild(title);

          const close = document.createElement('span');
          close.className = 'close';
          close.title = 'إغلاق التبويب';
          close.setAttribute('aria-label', 'إغلاق التبويب');
          close.textContent = '×';
          button.appendChild(close);

          button.addEventListener('click', (event) => {
            if (event.target === close) {
              api.closeTab(tab.id);
              return;
            }
            api.activate(tab.id);
          });
          button.addEventListener('auxclick', (event) => {
            if (event.button === 1) {
              event.preventDefault();
              api.closeTab(tab.id);
            }
          });

          tabsEl.appendChild(button);
        }

        const current = tabsEl.querySelector('.tab.active');
        current?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }

      newTabEl.addEventListener('click', () => api.newTab());
      tabsEl.addEventListener('dblclick', (event) => {
        if (event.target === tabsEl) api.newTab();
      });
      tabsEl.addEventListener('wheel', (event) => {
        if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
          tabsEl.scrollLeft += event.deltaY;
          event.preventDefault();
        }
      }, { passive: false });

      api.onState(render);
      api.ready();
    </script>
  </body>
</html>
